<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JAL - 入力ビューア</title>
<script src="config.js"></script>
<style>
:root {
    --sidebar-width: 280px;
    --header-height: 70px;

    --jal-dark-red: #5a1005;
    --jal-gold: #b8860b;
    --jal-black: #000000;
    --jal-silver: #c0c0c0;
    --jal-bg: #f3f3f3;
    --jal-white: #ffffff;
    --jal-text: #333333;
    --jal-border: #d9d9d9;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", "Yu Gothic UI", Arial, sans-serif;
    background: var(--jal-bg);
}

.container {
    display: flex;
    width: 100%;
    height: 100vh;
}

.sidebar {
    width: var(--sidebar-width);
    padding: var(--header-height) 10px 10px 10px;
    background: var(--jal-bg);
    border-right: 3px solid var(--jal-gold);
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
}

.sidebar button {
    padding: 10px 12px;
    border: 2px solid var(--jal-black);
    border-radius: 6px;
    background: var(--jal-dark-red);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
}

.sidebar button:hover {
    background: var(--jal-silver);
    color: var(--jal-dark-red);
    border-color: var(--jal-gold);
    transform: translateX(3px);
}

.info-section {
    margin-top: 15px;
    padding: 10px;
    background: var(--jal-white);
    border: 2px solid var(--jal-gold);
    border-radius: 6px;
}

.info-section h3 {
    font-size: 13px;
    color: var(--jal-dark-red);
    margin-bottom: 8px;
    font-weight: 700;
}

.auto-query-btn {
    width: 100%;
    padding: 10px;
    border: 2px solid #1a73e8;
    border-radius: 6px;
    background: #1a73e8;
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-bottom: 10px;
}

.auto-query-btn:hover {
    background: #1557b0;
    border-color: #1557b0;
    box-shadow: 0 0 10px rgba(26, 115, 232, 0.3);
}

.auto-query-btn:disabled {
    background: #cccccc;
    border-color: #cccccc;
    cursor: not-allowed;
}

.input-group {
    margin-bottom: 10px;
}

.input-group label {
    display: block;
    font-size: 12px;
    color: var(--jal-text);
    margin-bottom: 4px;
    font-weight: 600;
}

.input-group input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--jal-border);
    border-radius: 4px;
    font-size: 13px;
}

.query-btn {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--jal-dark-red);
    border-radius: 4px;
    background: var(--jal-dark-red);
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}

.query-btn:hover {
    background: var(--jal-gold);
    border-color: var(--jal-gold);
}

.result-display {
    margin-top: 10px;
    padding: 8px;
    background: #f9f9f9;
    border: 1px solid var(--jal-border);
    border-radius: 4px;
    font-size: 12px;
    color: var(--jal-text);
    min-height: 60px;
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
    line-height: 1.6;
}

.content {
    flex: 1;
    position: relative;
    background: var(--jal-bg);
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.top-controls {
    height: var(--header-height);
    flex-shrink: 0;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    align-items: center;
    padding: 0 20px;
    background: var(--jal-bg);
    border-bottom: 2px solid var(--jal-gold);
    z-index: 9999;
    flex-wrap: wrap;
}

.mode-btn {
    padding: 10px 18px;
    min-width: 170px;
    border: 1px solid var(--jal-border);
    border-radius: 6px;
    background: var(--jal-white);
    color: var(--jal-text);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
}

.mode-btn:hover {
    background: var(--jal-dark-red);
    color: var(--jal-white);
    border-color: var(--jal-dark-red);
}

.mode-btn.active {
    background: var(--jal-dark-red);
    color: var(--jal-white);
    border-color: var(--jal-dark-red);
    box-shadow: 0 3px 10px rgba(133, 32, 12, 0.25);
}

.print-btn {
    padding: 10px 14px;
    border: 1px solid #555555;
    border-radius: 6px;
    background: #555555;
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
}

.print-btn:hover {
    background: #1a73e8;
    border-color: #1a73e8;
    box-shadow: 0 0 10px rgba(26, 115, 232, 0.3);
}

#viewer {
    flex: 1;
    width: 100%;
    border: none;
    background: var(--jal-white);
    min-height: 0;
}

.loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 16px;
    color: var(--jal-text);
    z-index: 1;
}
</style>
</head>
<body>
<div class="container">
    <div class="sidebar">
        <button onclick="openSheet('so')">🧭 DLCSO入力</button>
        <button onclick="openSheet('ffu')">📦 DLCFFU入力</button>
        <button onclick="openPage('pti_today.html')">🧳 DLCPTI当日入力</button>
        <button onclick="openPage('pti_next.html')">🧳 DLCPTI翌日入力</button>
        <button onclick="openSheet('kkm')">🛠️ DLCKKM入力</button>
        <button onclick="openSheet('mgr')">👥 代表MGR入力</button>
        
        <div class="info-section">
            <h3>🔍 情報検索</h3>
            <button class="auto-query-btn" id="autoQueryBtn" onclick="autoQuery()">📥 自動読取＆検索</button>
            
            <div class="input-group">
                <label for="dlyCodeInput">DLY CODE (E6):</label>
                <input type="text" id="dlyCodeInput" placeholder="例: 05AT/01AF">
            </div>
            <div class="input-group">
                <label for="aircraftInput">機材番号 (D5):</label>
                <input type="text" id="aircraftInput" placeholder="例: JA821J">
            </div>
            <button class="query-btn" onclick="queryInfo()">🔍 検索</button>
            <div class="result-display" id="resultDisplay">検索結果がここに表示されます</div>
        </div>
    </div>

    <div class="content">
        <div class="top-controls">
            <button class="mode-btn active" onclick="switchMode('memo', this)">📅 FLT HDLG MEMO(当日)</button>
            <button class="mode-btn" onclick="switchMode('brief', this)">📋 DE-BRIEFING NOTE</button>
            <button class="mode-btn" onclick="switchMode('next', this)">📅 FLT HDLG MEMO(翌日)</button>
            <button class="print-btn" onclick="printCurrent()">🖨️ 印刷</button>
        </div>
        <div class="loading" id="loading">読み込み中...</div>
        <iframe id="viewer" title="Google Sheet Viewer"></iframe>
    </div>
</div>

<script>
const spreadsheetId = CONFIG.spreadsheetId;
const modes = CONFIG.modes;
const departments = CONFIG.departments;

// DLY CODE对照表URL
const DLY_CODE_SHEET_ID = "1QITJPV6C8Yn0xXA1aVMLrBx1mAMH2wSBBPghrjMb3YA";
const DLY_CODE_GID = "0";

// ICE限制表URL
const ICE_SHEET_ID = "1gGQAWYogwxUDAB3fhByL-DbMn8AEzCtYoddHGUfOc2I";
const ICE_GID = "1808923082";

let currentMode = "memo";
let dlyCodeData = null;
let iceData = null;

// 从 CONFIG.departments 读取 gid 并打开编辑页面
function openSheet(deptKey) {
    const gid = departments[deptKey].gid;
    const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/edit?pli=1&gid=${gid}#gid=${gid}`;
    window.open(url, "_blank", "noopener,noreferrer");
}

function openPage(url) {
    window.open(url, "_blank", "noopener,noreferrer");
}

function getCleanUrl(gid) {
    return `https://docs.google.com/spreadsheets/d/${spreadsheetId}/htmlembed?gid=${gid}&widget=true&chrome=false&single=true&headers=false`;
}

function getEditUrl(gid) {
    return `https://docs.google.com/spreadsheets/d/${spreadsheetId}/edit?gid=${gid}#gid=${gid}`;
}

function switchMode(mode, btn) {
    currentMode = mode;
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    
    const viewer = document.getElementById("viewer");
    const loading = document.getElementById("loading");
    
    loading.style.display = "block";
    viewer.src = getCleanUrl(modes[mode]);
    
    viewer.onload = function() {
        loading.style.display = "none";
    };
}

function printCurrent() {
    const url = getEditUrl(modes[currentMode]);
    window.open(url, "_blank", "noopener,noreferrer");
}

// CSV解析函数
function parseCSV(csvText) {
    const lines = csvText.split('\n');
    const result = [];
    
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line) {
            const cells = [];
            let currentCell = '';
            let inQuotes = false;
            
            for (let j = 0; j < line.length; j++) {
                const char = line[j];
                
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    cells.push(currentCell.trim());
                    currentCell = '';
                } else {
                    currentCell += char;
                }
            }
            cells.push(currentCell.trim());
            
            result.push(cells);
        }
    }
    
    return result;
}

// 加载DLY CODE对照表
async function loadDlyCodeData() {
    if (dlyCodeData) return dlyCodeData;
    
    try {
        const url = `https://docs.google.com/spreadsheets/d/${DLY_CODE_SHEET_ID}/export?format=csv&gid=${DLY_CODE_GID}`;
        const response = await fetch(url);
        const csvText = await response.text();
        dlyCodeData = parseCSV(csvText);
        return dlyCodeData;
    } catch (error) {
        console.error('DLY CODEデータの読み込みに失敗しました:', error);
        return null;
    }
}

// 加载ICE限制表
async function loadIceData() {
    if (iceData) return iceData;
    
    try {
        const url = `https://docs.google.com/spreadsheets/d/${ICE_SHEET_ID}/export?format=csv&gid=${ICE_GID}`;
        const response = await fetch(url);
        const csvText = await response.text();
        iceData = parseCSV(csvText);
        return iceData;
    } catch (error) {
        console.error('ICEデータの読み込みに失敗しました:', error);
        return null;
    }
}

// 使用Google Visualization API读取单元格
async function readCell(gid, cellRange) {
    try {
        const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?gid=${gid}&range=${cellRange}`;
        const response = await fetch(url);
        const text = await response.text();
        
        const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?/);
        if (!jsonMatch) {
            console.error('レスポンスの解析に失敗しました');
            return null;
        }
        
        const json = JSON.parse(jsonMatch[1]);
        
        if (json.table && json.table.rows && json.table.rows.length > 0) {
            const row = json.table.rows[0];
            if (row.c && row.c.length > 0 && row.c[0]) {
                return row.c[0].v || '';
            }
        }
        
        return '';
    } catch (error) {
        console.error(`セル ${cellRange} の読み込みに失敗しました:`, error);
        return null;
    }
}

// 自动读取E6和D5并查询
async function autoQuery() {
    const autoQueryBtn = document.getElementById('autoQueryBtn');
    const resultDisplay = document.getElementById('resultDisplay');
    
    if (currentMode !== 'memo') {
        resultDisplay.textContent = '📅 FLT HDLG MEMO(当日) モードでのみ利用可能です';
        return;
    }
    
    autoQueryBtn.disabled = true;
    autoQueryBtn.textContent = '📥 読み込み中...';
    resultDisplay.textContent = 'E6とD5セルを読み込んでいます...';
    
    try {
        const e6Value = await readCell(modes.memo, 'E6');
        const d5Value = await readCell(modes.memo, 'D5');
        
        if (e6Value === null || d5Value === null) {
            resultDisplay.textContent = '❌ セルの読み込みに失敗しました。\n\n確認事項:\n1. Google Sheetsが「リンクを知っている全員が閲覧可能」に設定されているか\n2. ブラウザのコンソールでエラーを確認してください';
            autoQueryBtn.disabled = false;
            autoQueryBtn.textContent = '📥 自動読取＆検索';
            return;
        }
        
        document.getElementById('dlyCodeInput').value = e6Value;
        document.getElementById('aircraftInput').value = d5Value;
        
        resultDisplay.textContent = `✅ 読み込み完了\nE6: ${e6Value}\nD5: ${d5Value}\n\n検索を実行します...`;
        
        await queryInfo();
        
    } catch (error) {
        console.error('自動読み込みエラー:', error);
        resultDisplay.textContent = '❌ エラーが発生しました: ' + error.message;
    } finally {
        autoQueryBtn.disabled = false;
        autoQueryBtn.textContent = '📥 自動読取＆検索';
    }
}

// 查询DLY CODE
function queryDlyCode(code, data) {
    if (!data || data.length < 2) return null;
    
    let twoCharCode = code;
    if (code.length >= 4 && /^\d{2}[A-Z]{2}$/.test(code)) {
        twoCharCode = code.substring(2);
    }
    
    for (let i = 1; i < data.length; i++) {
        const row = data[i];
        if (row[1] && row[1].trim() === twoCharCode) {
            return row[6] || '';
        }
    }
    
    return null;
}

// 查询ICE限制
function queryIceLimit(aircraftCode, data) {
    if (!data || data.length < 2) return null;
    
    for (let i = 1; i < data.length; i++) {
        const row = data[i];
        if (row[0] && row[0].trim() === aircraftCode) {
            const aircraftType = row[1] || '';
            const iceLimit = row[14] || '';
            return { aircraftType, iceLimit };
        }
    }
    
    return null;
}

// 主查询函数
async function queryInfo() {
    const dlyCodeInput = document.getElementById('dlyCodeInput').value.trim();
    const aircraftInput = document.getElementById('aircraftInput').value.trim();
    const resultDisplay = document.getElementById('resultDisplay');
    
    let resultText = '';
    
    if (dlyCodeInput && dlyCodeInput !== '-' && dlyCodeInput !== '') {
        resultDisplay.textContent = '検索中...';
        
        const dlyData = await loadDlyCodeData();
        
        if (dlyData) {
            const codes = dlyCodeInput.split('/');
            const explanations = [];
            
            for (const code of codes) {
                const trimmedCode = code.trim();
                if (trimmedCode && trimmedCode !== '-') {
                    const explanation = queryDlyCode(trimmedCode, dlyData);
                    if (explanation) {
                        let twoCharCode = trimmedCode;
                        if (trimmedCode.length >= 4 && /^\d{2}[A-Z]{2}$/.test(trimmedCode)) {
                            twoCharCode = trimmedCode.substring(2);
                        }
                        explanations.push(`${twoCharCode}: ${explanation}`);
                    }
                }
            }
            
            if (explanations.length > 0) {
                resultText += '【遅延の理由】\n' + explanations.join('\n') + '\n\n';
            } else {
                resultText += '【遅延の理由】\n該当するデータが見つかりませんでした\n\n';
            }
        } else {
            resultText += '【遅延の理由】\nデータの読み込みに失敗しました\n\n';
        }
    }
    
    if (aircraftInput) {
        const iceDataResult = await loadIceData();
        
        if (iceDataResult) {
            const iceInfo = queryIceLimit(aircraftInput, iceDataResult);
            
            if (iceInfo) {
                resultText += `【ICE制限】\n${iceInfo.aircraftType} ICEの最大制限: ${iceInfo.iceLimit}kgs`;
            } else {
                resultText += '【ICE制限】\n該当する機材番号が見つかりませんでした';
            }
        } else {
            resultText += '【ICE制限】\nデータの読み込みに失敗しました';
        }
    }
    
    if (!resultText) {
        resultText = 'DLY CODEまたは機材番号を入力してください';
    }
    
    resultDisplay.textContent = resultText;
}

window.onload = function() {
    const viewer = document.getElementById("viewer");
    const loading = document.getElementById("loading");
    
    viewer.src = getCleanUrl(modes[currentMode]);
    
    viewer.onload = function() {
        loading.style.display = "none";
    };
    
    loadDlyCodeData();
    loadIceData();
};
</script>
</body>
</html>
